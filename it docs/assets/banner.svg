<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="SkillProof banner">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d99a55" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#5a3a24" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#14100d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a4f31"/>
      <stop offset="100%" stop-color="#d99a55"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="#14100d"/>
  <circle cx="1090" cy="90" r="260" fill="url(#glow)"/>
  <circle cx="140" cy="380" r="200" fill="url(#glow)" opacity="0.6"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#bar)"/>

  <text x="90" y="110" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700"
        letter-spacing="5" fill="#d99a55">OPEN SOURCE  ·  FREE  ·  IN YOUR BROWSER</text>

  <text x="86" y="230" font-family="Helvetica, Arial, sans-serif" font-size="120" font-weight="900"
        fill="#f4ead8" letter-spacing="-3">Skill<tspan font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-weight="700" fill="#d99a55" letter-spacing="-1">Proof</tspan></text>

  <text x="90" y="292" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic"
        fill="#e8d9bb">Agent skills are easy to write. Hard to trust.</text>

  <text x="90" y="345" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#b9a88c">Check  ·  Measure  ·  Compare  ·  Prove</text>

  <rect x="90" y="372" width="160" height="4" rx="2" fill="url(#bar)"/>
</svg>
